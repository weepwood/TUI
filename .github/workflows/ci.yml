name: Verify React component library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build showcase
        run: npm run build
      - name: Build distributable package and TypeScript definitions
        run: npm run build:lib
      - name: Test public component exports
        run: npm run test:lib
      - name: Verify npm package content
        run: npm pack --dry-run ./packages/react
