<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI / PLAYGROUND — 可交互组件展示库</title>
    <meta name="description" content="一个通用的 React UI 组件展示与灵感库，涵盖按钮、表单、反馈、导航、动效和微交互，每个组件都可直接体验。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141419'/%3E%3Cpath d='M8 9h16v5h-5.5v9h-5v-9H8z' fill='%23ffb02e'/%3E%3C/svg%3E" />
    <script>
      /* 首帧前按系统外观设定主题，避免闪烁 */
      document.documentElement.dataset.theme =
        matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体异步加载：不阻塞首帧渲染，CDN 不可达时以系统字体降级 -->

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
